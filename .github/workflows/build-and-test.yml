name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The signal that matters for a change to ThreatResource. A failure here
      # fails the build.
      - name: ThreatResource tests
        run: mvn -B -ntp test -Dtest=ThreatResourceTest -DfailIfNoSpecifiedTests=true

      # Informational until the baseline is known green. Flip continue-on-error
      # to false once the whole suite passes reliably on a runner.
      - name: Full test suite
        continue-on-error: true
        run: mvn -B -ntp test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
